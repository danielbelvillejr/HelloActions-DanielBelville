# The name displayed in the GitHub Actions tab.
name: Hello World with Python

# Events that start this workflow.
on:
  # Run when code is pushed to main.
  push:
    branches:
      - main

  # Allow the workflow to be started manually.
  workflow_dispatch:

jobs:
  hello-python:
    name: Run the Python Hello World program
    runs-on: ubuntu-latest

    steps:
      # Download the repository files onto the GitHub runner.
      - name: Check out the repository
        uses: actions/checkout@v4

      # Set up Python on the GitHub runner.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Run the program and provide the greeting through an environment variable.
      - name: Run the Python program
        env:
          WHO_TO_GREET: "GitHub Actions Student"
        run: python hello.py